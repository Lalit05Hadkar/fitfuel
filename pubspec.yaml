name: fitfuel
description: FitFuel – calorie and fitness tracker with AI meal photo scanning.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0E0F0C"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true
